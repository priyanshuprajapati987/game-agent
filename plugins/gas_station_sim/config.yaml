    daily_wage: 100
    shift_hours: 8
    
  tips:
    - "Pay employees before assigning tasks"
    - "Assign same role to level up skills"
    - "Need at least 2 cleaners"
    - "Cashier and pump attendant are essential"

# ============================================
# GAME TIPS FOR AGENT
# ============================================
