  cleaning:
    - "Desert sand tracks in constantly"
    - "Dirty floor = lost customers"
    - "Empty trash BEFORE green fumes"
    - "Carry bags to dumpster outside"
    
  pumping:
    - "Tap Shift for small fills"
    - "Release early - needle overshoots"
    - "Green zone = perfect service"
    - "Red zone = wasted fuel"
    
  workshop:
    - "Activate ramp first"
    - "Scan for red-outlined parts"
    - "Keep spare parts in stock"
    - "Paint scratches with drag motion"
    
  dennis:
    - "Appears randomly when busy"
    - "Throw trash at him (right-click)"
    - "Keep trash equipped nearby"
    - "Ignore graffiti - it's cosmetic"
    
  warehouse:
    - "CLOSE door after delivery"
    - "Open door = items get stolen"
    - "Order supplies in advance"
    
  general:
    - "Close station for maintenance"
    - "Use reset button for stuck vehicles"
    - "Stock variety for more sales"
    - "Party bus = stock everything!"
    - "Uncle's debt timer = ignore it"
