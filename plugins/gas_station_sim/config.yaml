# ============================================
# PUMPING GAS MINIGAME DETAILS
# ============================================
pumping_minigame:
  description: |
    Gas pumping is a timing minigame:
    1. Grab pump handle (left click)
    2. Position at car fuel tank
    3. Hold LEFT MOUSE to pump
    4. Watch the SPEED NEEDLE
    5. Keep needle in GREEN ZONE for perfect pumping
    6. Use LEFT SHIFT to speed up (careful - overshoots!)
    7. Release when tank is full
    
  speed_meter:
    position: center_bottom
    needle_range: 0-100
    green_zone: 40-60  # Perfect speed
    red_zone: 80-100  # Too fast - waste fuel
    
  tips:
    - "TAP shift for small amounts"
    - "Release BEFORE needle reaches target"
    - "Needle overshoots after long holds"
    - "Green zone = customer happy"
    - "Red zone = wasted fuel, less money"

# ============================================
# GAME STATES
# ============================================
states:
  idle:
    description: "Looking around, no active task"
    priority: 0
    
  customer_at_pump:
    description: "Customer car waiting at gas pump"
    priority: 10
    
  pumping_gas:
    description: "Actively pumping gas into car"
    priority: 10
    
  customer_at_register:
    description: "Customer ready to pay"
    priority: 9
    
  at_register:
    description: "Scanning items and taking payment"
    priority: 9
    
  car_in_workshop:
    description: "Car needs repair on ramp"
    priority: 8
    
  fixing_car:
    description: "Repairing car parts"
    priority: 8
    
  floor_dirty:
    description: "Floor needs sweeping"
    priority: 6
    
  cleaning:
    description: "Sweeping floor or emptying trash"
    priority: 6
    
  dennis_active:
    description: "Dennis spraying graffiti"
    priority: 20  # HIGHEST - stop him!
    
  dealing_dennis:
    description: "Chasing away Dennis"
    priority: 20
    
  delivery_arrived:
    description: "Delivery truck at warehouse"
    priority: 7
    
  receiving_delivery:
    description: "Unloading delivery boxes"
    priority: 7
    
  fuel_low:
    description: "Gas station fuel running low"
    priority: 15
    
  ordering_fuel:
    description: "Using computer to order fuel"
    priority: 15

# ============================================
# PRIORITY SYSTEM
# ============================================
priority_order:
  - dennis_active: 20      # STOP DENNIS IMMEDIATELY
  - fuel_low: 15            # Order fuel ASAP
  - customer_at_pump: 10    # Serve customer
  - pumping_gas: 10         # Finish pumping
  - customer_at_register: 9 # Take payment
  - at_register: 9          # Complete sale
  - car_in_workshop: 8      # Fix car
  - fixing_car: 8           # Complete repair
  - delivery_arrived: 7     # Unload delivery
  - receiving_delivery: 7   # Finish unloading
  - floor_dirty: 6          # Clean floor
  - cleaning: 6             # Finish cleaning
  - idle: 0                 # Default

