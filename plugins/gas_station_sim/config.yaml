game_name: "Gas Station Simulator"
window:
  title: "Gas Station Simulator"
  class_name: "UnityWndClass"

capture:
  method: "auto"
  monitor: 0

resolution:
  reference: [1920, 1080]

vision:
  confidence: 0.75

input:
  human_like: true
  click_variance: 5
  delay_mean: 0.15
  delay_std: 0.05

loop_delay: 0.1

template_dir: "plugins/gas_station_sim/templates"

# ============================================
# GAS STATION SIMULATOR - STEAM VERSION
# App ID: 1149620
# ============================================

# ============================================
# KEYBOARD CONTROLS
# ============================================
controls:
  move_forward: "w"
  move_backward: "s"
  move_left: "a"
  move_right: "d"
  jump: "space"
  sprint: "left_shift"
  interact: "left_mouse"      # Grab, pump, click
  throw: "right_mouse"        # Throw trash at Dennis
  confirm: "e"
  cancel: "f"
  tool_menu: "tab"
  speed_boost: "left_shift"   # Pump speed

# ============================================
# GAME STATES
# ============================================
states:
  idle:
    description: "No active task"
    priority: 0
    
  customer_waiting:
    description: "Customer at gas pump"
    priority: 10
    
  pumping_gas:
    description: "Filling car with gas"
    priority: 10
    
  customer_paying:
    description: "Customer at register"
    priority: 9
    
  taking_payment:
    description: "Scanning items, taking money"
    priority: 9
    
  car_repair:
    description: "Car in workshop"
    priority: 8
    
  fixing_car:
    description: "Repairing car parts"
    priority: 8
    
  floor_dirty:
    description: "Floor needs cleaning"
    priority: 6
    
  cleaning:
    description: "Sweeping or emptying trash"
    priority: 6
    
  dennis_here:
    description: "Dennis spraying graffiti"
    priority: 20  # HIGHEST!
    
  chasing_dennis:
    description: "Throwing trash at Dennis"
    priority: 20
    
  delivery_truck:
    description: "Delivery arrived"
    priority: 7
    
  unloading:
    description: "Unloading boxes"
    priority: 7
    
  fuel_empty:
    description: "Out of fuel"
    priority: 15
    
  ordering:
    description: "Using computer"
    priority: 15

# ============================================
# PRIORITY ORDER
# ============================================
priority:
  - dennis_here: 20
  - fuel_empty: 15
  - customer_waiting: 10
  - pumping_gas: 10
  - customer_paying: 9
  - taking_payment: 9
  - car_repair: 8
  - fixing_car: 8
  - delivery_truck: 7
  - unloading: 7
  - floor_dirty: 6
  - cleaning: 6
  - idle: 0

# ============================================
# TEMPLATES TO DETECT (screenshot se match karna)
# ============================================
# Sirf naam rakho - coordinates mat do
# Agent khud screen pe dhundega

templates:
  # Customer Service
  - customer_car
  - customer_icon
  - customer_arrow
  
  # Gas Pumping
  - pump_handle
  - pump_nozzle
  - fuel_gauge
  - speed_meter
  - green_zone
  
  # Register
  - register_screen
  - register_items
  - total_amount
  - payment_button
  - receipt
  
  # Cleaning
  - broom
  - trash_can
  - trash_full
  - dumpster
  - dirty_floor
  
  # Workshop
  - workshop
  - ramp_button
  - car_on_ramp
  - broken_part
  - repair_complete
  
  # Warehouse
  - warehouse_door
  - delivery_truck
  - delivery_box
  
  # Dennis
  - dennis
  - graffiti
  
  # Management
  - computer
  - employee_tab
  - order_tab
  - hire_button
  
  # UI
  - open_sign
  - reset_button
  - money_display
  - dirt_meter
  - email_icon

# ============================================
# PUMPING MINIGAME
# ============================================
pumping:
  method: "timing"
  steps:
    - grab_handle: "Left click on pump"
    - position_nozzle: "Click on car fuel tank"
    - hold_trigger: "Hold Left Mouse"
    - watch_speed: "Keep needle in green zone"
    - speed_boost: "Tap Left Shift (careful!)"
    - release: "Stop when tank full"
  
  tips:
    - "Tap shift for small amounts"
    - "Release early - needle overshoots"
    - "Green zone = perfect"
    - "Red zone = waste fuel"

# ============================================
# GAMEPLAY TIPS
# ============================================
tips:
  - "Dennis = STOP EVERYTHING, throw trash"
  - "Floor dirty = customers leave"
  - "Empty trash before green fumes"
  - "Close warehouse door after delivery"
  - "Use reset button for stuck cars"
  - "Stock variety = more sales"
  - "Party bus = stock everything!"
