    y: 700
    w: 700
    h: 300
    description: "Dirty floor area"

  broom_icon:
    x: 100
    y: 900
    w: 60
    h: 60
    description: "Broom tool icon"

  # Warehouse
  warehouse_door:
    x: 200
    y: 300
    w: 200
    h: 400
    description: "Warehouse delivery door"

  delivery_truck:
    x: 100
    y: 250
    w: 300
    h: 250
    description: "Delivery truck"

  # Workshop
  car_on_ramp:
    x: 400
    y: 300
    w: 600
    h: 400
    description: "Car on repair ramp"

  ramp_button:
    x: 300
    y: 600
    w: 80
    h: 80
    description: "Button to raise/lower ramp"

  broken_part:
    x: 500
    y: 400
    w: 200
    h: 200
    description: "Broken car part (red outline)"

