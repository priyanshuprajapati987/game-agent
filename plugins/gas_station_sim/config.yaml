game_name: "Gas Station Simulator"
window:
  title: "Gas Station Simulator"
  class_name: "UnityWndClass"

capture:
  method: "auto"
  monitor: 0

resolution:
  reference: [1920, 1080]

vision:
  confidence: 0.75

ocr:
  lang: "en"

input:
  human_like: true
  click_variance: 5
  delay_mean: 0.15
  delay_std: 0.05

loop_delay: 0.1

template_dir: "plugins/gas_station_sim/templates"

# ============================================
# GAS STATION SIMULATOR - GAME DATA
# ============================================

