# ============================================
# KEYBOARD CONTROLS (STEAM VERSION)
# ============================================
controls:
  movement:
    forward: "w"
    backward: "s"
    left: "a"
    right: "d"
    jump: "space"
    sprint: "left_shift"
  
  interaction:
    primary_action: "left_mouse"  # Interact, grab, pump
    secondary_action: "right_mouse"  # Throw, secondary
    tool_menu: "tab"
    minigame_action: "left_shift"  # Speed up pumping
    
  ui:
    confirm: "e"
    cancel: "f"
    inventory: "i"
    pause: "escape"

