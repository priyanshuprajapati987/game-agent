    y: 300
    w: 400
    h: 300
    description: "Customer car at pump"

  customer_icon:
    x: 1700
    y: 200
    w: 150
    h: 150
    description: "Customer waiting indicator"

  customer_arrow:
    x: 1650
    y: 150
    w: 200
    h: 50
    description: "Arrow pointing to waiting customer"

