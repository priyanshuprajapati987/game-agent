  dirt_meter:
    x: 50
    y: 80
    w: 200
    h: 30
    description: "Floor cleanliness meter"

  popularity_bar:
    x: 50
    y: 120
    w: 200
    h: 25
    description: "Station popularity level"

  # Gas Pumping Area
  pump_handle:
    x: 800
    y: 400
    w: 100
    h: 150
    description: "Gas pump handle to grab"

  pump_trigger:
